services:
  backend:
    ports:
      - 5678:5678
    environment:
      FLASK_ENV: "development"
    command:
      - "sh"
      - "-c"
      - python src/backend.py

  # Frontend Web Service
  frontend:
    ports:
      - 5679:5678
    environment:
      FLASK_ENV: "development"
    command:
      - "sh"
      - "-c"
      - |
        python -m gunicorn --bind=0.0.0.0:3000 --workers=3 --timeout=120 \
        --reload frontend:app

  # Email Worker - Development mode
  email_worker:
    environment:
      FLASK_ENV: "development"
      EMAIL_WORKER_POLL_INTERVAL: 2  # Faster polling in dev mode

  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080
    networks:
      - asset-network

networks:
  asset-network:
    ipam:
      config:
        - subnet: 172.18.0.0/16
