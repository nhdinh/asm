{% extends "base.html" %}

{% block page_title %}Điều Chuyển Tài Sản{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow p-6 max-w-2xl mx-auto">
    <h3 class="text-lg font-bold mb-4">Điều Chuyển Tài Sản</h3>

    <div class="bg-blue-50 border border-blue-200 rounded p-4 mb-6">
        <h4 class="font-bold text-blue-800 mb-2">Thông tin tài sản</h4>
        <table class="w-full text-sm">
            <tr>
                <td class="py-1 font-medium text-gray-600">Mã tài sản:</td>
                <td class="py-1">{{ asset.code }}</td>
            </tr>
            <tr>
                <td class="py-1 font-medium text-gray-600">Tên tài sản:</td>
                <td class="py-1 font-bold">{{ asset.name }}</td>
            </tr>
            <tr>
                <td class="py-1 font-medium text-gray-600">Phòng ban hiện tại:</td>
                <td class="py-1">{{ asset.department_name or '-' }}</td>
            </tr>
        </table>
    </div>

    <form method="POST">
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Phòng Ban Đích *</label>
                <select name="to_department_id" required class="border rounded px-3 py-2 w-full">
                    <option value="">Chọn phòng ban</option>
                    {% for dept in departments %}
                        {% if dept.id != asset.department_id %}
                        <option value="{{ dept.id }}">{{ dept.name }}</option>
                        {% endif %}
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Ghi Chú</label>
                <textarea name="notes" rows="4" placeholder="Nhập lý do điều chuyển..."
                          class="border rounded px-3 py-2 w-full"></textarea>
            </div>
        </div>

        <div class="mt-6 flex gap-2">
            <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                Xác Nhận Điều Chuyển
            </button>
            <a href="{{ url_for('asset_detail', id=asset.id) }}"
               class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">
                Hủy
            </a>
        </div>
    </form>
</div>
{% endblock %}
