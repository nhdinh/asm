<!-- Password Policy Validator Component -->
<div id="password-policy-validator" class="mt-2 p-3 bg-gray-50 border border-gray-200 rounded hidden">
    <p class="text-sm font-medium text-gray-700 mb-2">Yêu cầu mật khẩu:</p>
    <ul class="text-xs space-y-1">
        <li id="policy-length" class="flex items-center">
            <span class="policy-icon mr-2">○</span>
            <span class="policy-text"></span>
        </li>
        <li id="policy-uppercase" class="flex items-center hidden">
            <span class="policy-icon mr-2">○</span>
            <span class="policy-text">Chứa ít nhất 1 chữ hoa (A-Z)</span>
        </li>
        <li id="policy-lowercase" class="flex items-center hidden">
            <span class="policy-icon mr-2">○</span>
            <span class="policy-text">Chứa ít nhất 1 chữ thường (a-z)</span>
        </li>
        <li id="policy-digit" class="flex items-center hidden">
            <span class="policy-icon mr-2">○</span>
            <span class="policy-text">Chứa ít nhất 1 chữ số (0-9)</span>
        </li>
        <li id="policy-special" class="flex items-center hidden">
            <span class="policy-icon mr-2">○</span>
            <span class="policy-text">Chứa ít nhất 1 ký tự đặc biệt (!@#$%...)</span>
        </li>
    </ul>
</div>

<script>
// Password Policy Validator
const PasswordPolicyValidator = {
    policy: null,

    async init() {
        try {
            const response = await fetch('/api/auth/password-policy');
            const data = await response.json();
            this.policy = data.policy;
            this.renderPolicy();
        } catch (error) {
            console.error('Failed to load password policy:', error);
        }
    },

    renderPolicy() {
        if (!this.policy) return;

        const validator = document.getElementById('password-policy-validator');
        if (validator) {
            validator.classList.remove('hidden');
        }

        // Update length requirement
        const lengthElement = document.getElementById('policy-length');
        if (lengthElement) {
            lengthElement.querySelector('.policy-text').textContent =
                `Ít nhất ${this.policy.password_min_length} ký tự`;
        }

        // Show/hide requirements based on policy
        if (this.policy.password_require_uppercase) {
            document.getElementById('policy-uppercase')?.classList.remove('hidden');
        }
        if (this.policy.password_require_lowercase) {
            document.getElementById('policy-lowercase')?.classList.remove('hidden');
        }
        if (this.policy.password_require_digit) {
            document.getElementById('policy-digit')?.classList.remove('hidden');
        }
        if (this.policy.password_require_special) {
            document.getElementById('policy-special')?.classList.remove('hidden');
        }
    },

    validate(password) {
        if (!this.policy || !password) {
            return { valid: false, errors: [] };
        }

        const errors = [];

        // Check minimum length
        const minLength = this.policy.password_min_length || 8;
        const lengthValid = password.length >= minLength;
        this.updateIndicator('policy-length', lengthValid);
        if (!lengthValid) {
            errors.push(`Mật khẩu phải có ít nhất ${minLength} ký tự`);
        }

        // Check uppercase requirement
        if (this.policy.password_require_uppercase) {
            const uppercaseValid = /[A-Z]/.test(password);
            this.updateIndicator('policy-uppercase', uppercaseValid);
            if (!uppercaseValid) {
                errors.push('Mật khẩu phải chứa ít nhất 1 chữ cái viết hoa');
            }
        }

        // Check lowercase requirement
        if (this.policy.password_require_lowercase) {
            const lowercaseValid = /[a-z]/.test(password);
            this.updateIndicator('policy-lowercase', lowercaseValid);
            if (!lowercaseValid) {
                errors.push('Mật khẩu phải chứa ít nhất 1 chữ cái viết thường');
            }
        }

        // Check digit requirement
        if (this.policy.password_require_digit) {
            const digitValid = /\d/.test(password);
            this.updateIndicator('policy-digit', digitValid);
            if (!digitValid) {
                errors.push('Mật khẩu phải chứa ít nhất 1 chữ số');
            }
        }

        // Check special character requirement
        if (this.policy.password_require_special) {
            const specialValid = /[!@#$%^&*(),.?":{}|<>_\-+=\[\]\\\/~`]/.test(password);
            this.updateIndicator('policy-special', specialValid);
            if (!specialValid) {
                errors.push('Mật khẩu phải chứa ít nhất 1 ký tự đặc biệt (!@#$%^&*...)');
            }
        }

        return {
            valid: errors.length === 0,
            errors: errors
        };
    },

    updateIndicator(elementId, isValid) {
        const element = document.getElementById(elementId);
        if (!element) return;

        const icon = element.querySelector('.policy-icon');
        const text = element.querySelector('.policy-text');

        if (isValid) {
            icon.textContent = '✓';
            icon.classList.add('text-green-600');
            icon.classList.remove('text-red-600');
            text.classList.add('text-green-600');
            text.classList.remove('text-red-600');
        } else {
            icon.textContent = '✗';
            icon.classList.add('text-red-600');
            icon.classList.remove('text-green-600');
            text.classList.add('text-red-600');
            text.classList.remove('text-green-600');
        }
    },

    reset() {
        const indicators = ['policy-length', 'policy-uppercase', 'policy-lowercase', 'policy-digit', 'policy-special'];
        indicators.forEach(id => {
            const element = document.getElementById(id);
            if (!element) return;

            const icon = element.querySelector('.policy-icon');
            const text = element.querySelector('.policy-text');

            icon.textContent = '○';
            icon.classList.remove('text-green-600', 'text-red-600');
            text.classList.remove('text-green-600', 'text-red-600');
        });
    }
};
</script>
