{% extends "base.html" %}

{% block page_title %}Thêm Tài Sản{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow p-6 max-w-2xl mx-auto">
    <h3 class="text-lg font-bold mb-4">Thêm Tài Sản Mới</h3>

    <form method="POST">
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium mb-1">Mã Tài Sản</label>
                <input type="text" name="code" required class="border rounded px-3 py-2 w-full">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Tên Tài Sản</label>
                <input type="text" name="name" required class="border rounded px-3 py-2 w-full">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Loại</label>
                <select id="category-select" class="border rounded px-3 py-2 w-full" onchange="toggleCategoryInput()">
                    <option value="">Chọn loại tài sản</option>
                    {% for cat in categories %}
                        <option value="{{ cat.name }}">{{ cat.name }} ({{ cat.asset_count }} tài sản)</option>
                    {% endfor %}
                    <option value="__other__">➕ Nhập loại mới...</option>
                </select>
                <input type="text" id="category-input" name="category" class="border rounded px-3 py-2 w-full mt-2"
                       placeholder="Nhập tên loại tài sản mới..." style="display: none;">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Giá Trị (VNĐ)</label>
                <input type="number" name="purchase_value" class="border rounded px-3 py-2 w-full"
                       placeholder="0">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Ngày Mua</label>
                <input type="date" name="purchase_date" class="border rounded px-3 py-2 w-full">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Phòng Ban *</label>
                <select name="department_id" required class="border rounded px-3 py-2 w-full">
                    <option value="">Chọn phòng ban</option>
                    {% for dept in departments %}
                        <option value="{{ dept.id }}">{{ dept.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Trạng Thái</label>
                <select name="status" class="border rounded px-3 py-2 w-full">
                    <option value="active">Hoạt động</option>
                    <option value="damaged">Hư hỏng</option>
                    <option value="disposed">Đã thanh lý</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Bàn Giao Cho</label>
                <select name="assigned_to_id" class="border rounded px-3 py-2 w-full">
                    <option value="">Chưa bàn giao</option>
                    {% for dept in departments %}
                        <optgroup label="{{ dept.name }}">
                            {% for user in users if user.departments and dept.id in (user.departments | map(attribute='id') | list) %}
                                <option value="{{ user.id }}">{{ user.username }} ({{ user.email }})</option>
                            {% endfor %}
                        </optgroup>
                    {% endfor %}
                </select>
            </div>
            <div class="col-span-2">
                <label class="block text-sm font-medium mb-1">Mô Tả</label>
                <textarea name="description" rows="3" class="border rounded px-3 py-2 w-full"
                          placeholder="Nhập mô tả chi tiết về tài sản..."></textarea>
            </div>
            <div class="col-span-2">
                <label class="block text-sm font-medium mb-1">Tình Trạng Chi Tiết</label>
                <textarea name="condition_notes" rows="2" class="border rounded px-3 py-2 w-full"
                          placeholder="VD: Vỡ góc trái, bị xước mặt trước, chưa bị hỏng chức năng..."></textarea>
            </div>
            <div class="col-span-2">
                <label class="block text-sm font-medium mb-1">Vị Trí</label>
                <input type="text" name="location" class="border rounded px-3 py-2 w-full"
                       placeholder="VD: Tòa nhà A, Phòng 301, Kệ B3...">
            </div>
        </div>

        <div class="mt-6 flex gap-2">
            <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                Tạo Tài Sản
            </button>
            <a href="{{ url_for('assets') }}"
               class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">
                Hủy
            </a>
        </div>
    </form>
</div>

<script>
function toggleCategoryInput() {
    const select = document.getElementById('category-select');
    const input = document.getElementById('category-input');

    if (select.value === '__other__') {
        input.style.display = 'block';
        input.required = false;
        input.value = '';
        input.focus();
    } else {
        input.style.display = 'none';
        input.required = false;
        input.value = select.value;
    }
}

// Set initial value
document.addEventListener('DOMContentLoaded', function() {
    const select = document.getElementById('category-select');
    const input = document.getElementById('category-input');
    input.value = select.value;
});
</script>
{% endblock %}
