{% extends "base.html" %}

{% block page_title %}Sửa Tài Sản{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow p-6 max-w-2xl mx-auto">
    <h3 class="text-lg font-bold mb-4">Sửa Thông Tin Tài Sản</h3>

    <form method="POST">
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium mb-1">Mã Tài Sản</label>
                <input type="text" value="{{ asset.code }}" disabled
                       class="border rounded px-3 py-2 w-full bg-gray-100">
                <p class="text-xs text-gray-500 mt-1">Mã tài sản không thể thay đổi</p>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Tên Tài Sản *</label>
                <input type="text" name="name" value="{{ asset.name }}" required
                       class="border rounded px-3 py-2 w-full">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Loại</label>
                <input type="text" name="category" value="{{ asset.category or '' }}"
                       class="border rounded px-3 py-2 w-full">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Giá Trị (VNĐ)</label>
                <input type="number" name="purchase_value" value="{{ asset.purchase_value or 0 }}"
                       class="border rounded px-3 py-2 w-full">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Ngày Mua</label>
                <input type="date" name="purchase_date" value="{{ asset.purchase_date or '' }}"
                       class="border rounded px-3 py-2 w-full">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Trạng Thái</label>
                <select name="status" class="border rounded px-3 py-2 w-full">
                    <option value="active" {% if asset.status == 'active' %}selected{% endif %}>Hoạt động</option>
                    <option value="damaged" {% if asset.status == 'damaged' %}selected{% endif %}>Hư hỏng</option>
                    <option value="disposed" {% if asset.status == 'disposed' %}selected{% endif %}>Đã thanh lý</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Bàn Giao Cho</label>
                <select name="assigned_to_id" class="border rounded px-3 py-2 w-full">
                    <option value="">Chưa bàn giao</option>
                    {% for dept in departments %}
                        <optgroup label="{{ dept.name }}">
                            {% for user in users if user.departments and dept.id in (user.departments | map(attribute='id') | list) %}
                                <option value="{{ user.id }}" {% if asset.assigned_to_id == user.id %}selected{% endif %}>
                                    {{ user.username }} ({{ user.email }})
                                </option>
                            {% endfor %}
                        </optgroup>
                    {% endfor %}
                </select>
            </div>
            <div class="col-span-2">
                <label class="block text-sm font-medium mb-1">Mô Tả</label>
                <textarea name="description" rows="3"
                          class="border rounded px-3 py-2 w-full">{{ asset.description or '' }}</textarea>
            </div>
            <div class="col-span-2">
                <label class="block text-sm font-medium mb-1">Tình Trạng Chi Tiết</label>
                <textarea name="condition_notes" rows="3" placeholder="VD: Bị xước ở góc trên bên trái, màn hình hoạt động tốt..."
                          class="border rounded px-3 py-2 w-full">{{ asset.condition_notes or '' }}</textarea>
            </div>
        </div>

        <div class="mt-6 flex gap-2">
            <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                Lưu Thay Đổi
            </button>
            <a href="{{ url_for('assets') }}"
               class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">
                Hủy
            </a>
        </div>
    </form>
</div>
{% endblock %}
