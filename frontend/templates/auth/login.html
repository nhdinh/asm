{% extends "base.html" %}

{% block title %}Đăng nhập - Hệ thống Quản lý Tài sản{% endblock %}

{% block extra_css %}
<style>
    .login-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .login-card {
        background: white;
        border-radius: 15px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        width: 100%;
        max-width: 400px;
    }
    
    .login-header {
        background: var(--primary-color);
        color: white;
        padding: 30px;
        text-align: center;
    }
    
    .login-header h3 {
        margin: 0;
        font-weight: 300;
    }
    
    .login-header .icon {
        font-size: 3rem;
        margin-bottom: 15px;
        opacity: 0.9;
    }
    
    .login-body {
        padding: 40px 30px;
    }
    
    .form-floating > .form-control {
        border-radius: 10px;
        border: 2px solid #e9ecef;
        transition: all 0.3s ease;
    }
    
    .form-floating > .form-control:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 0.2rem rgba(44, 62, 80, 0.1);
    }
    
    .btn-login {
        background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        border: none;
        border-radius: 10px;
        padding: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.3s ease;
    }
    
    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }
    
    .default-credentials {
        background-color: #f8f9fa;
        border-radius: 10px;
        padding: 15px;
        margin-top: 20px;
        font-size: 0.9rem;
        color: #6c757d;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="icon">
                <i class="fas fa-boxes"></i>
            </div>
            <h3>Hệ thống Quản lý Tài sản</h3>
            <p class="mb-0">Vui lòng đăng nhập để tiếp tục</p>
        </div>
        
        <div class="login-body">
            <form method="POST" id="login_box">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username" name="username" 
                           placeholder="Tên đăng nhập" value="admin" required>
                    <label for="username">
                        <i class="fas fa-user me-2"></i>Tên đăng nhập
                    </label>
                </div>
                
                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="password" name="password" 
                           placeholder="Mật khẩu" value="admin123" required>
                    <label for="password">
                        <i class="fas fa-lock me-2"></i>Mật khẩu
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-login w-100">
                    <i class="fas fa-sign-in-alt me-2"></i>Đăng nhập
                </button>
            </form>
            
            <div class="default-credentials">
                <strong>Tài khoản mặc định:</strong><br>
                <i class="fas fa-user"></i> admin / admin123<br>
                <small>Vai trò: Quản lý chung</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
