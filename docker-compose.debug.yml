services:
  backend:
    ports:
      - 5678:5678
    environment:
      FLASK_ENV: development
    command:
      - "sh"
      - "-c"
      - |
        pip install debugpy -t /tmp \
        && python /tmp/debugpy --wait-for-client --listen 0.0.0.0:5678 \
        src/backend.py

  # Frontend Web Service
  frontend:
    ports:
      - 5679:5678
    environment:
      FLASK_ENV: development
    command: 
      - "sh"
      - "-c"
      - |
        pip install debugpy -t /tmp \
        && python /tmp/debugpy --wait-for-client --listen 0.0.0.0:5678 \
        -m gunicorn --bind 0.0.0.0:3000 --reload --workers 2 --timeout 120 src.frontend:app

  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080
    networks:
      - asset-network