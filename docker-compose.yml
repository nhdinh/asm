#version: '3.8'

secrets:
  postgres_user:
    file: ./.secrets/postgres_user.txt
  postgres_password:
    file: ./.secrets/postgres_password.txt
  redis_password:
    file: ./.secrets/redis_password.txt

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ams-backend
    secrets:
      - postgres_user
      - postgres_password
    ports:
      - 5000:5000
    volumes:
      - ./backend/data/:/app/data/
      - ./backend/logs/:/app/logs/
      - ./backend/src/:/app/src/
    environment:
      FLASK_ENV: production
      JWT_SECRET_KEY: ${BACKEND_JWT_SECRET_KEY}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - postgres
    networks:
      - asset-network

  # Frontend Web Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ams-frontend
    ports:
      - 3000:3000
    volumes:
      - ./frontend/logs/:/app/logs/
      - ./frontend/src/:/app/src/
      - ./frontend/templates/:/app/templates/
    environment:
      FLASK_ENV: production
      API_BASE_URL: http://backend:5000
      SECRET_KEY: ${FRONTEND_APP_SECRET}
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - asset-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ams-nginx
    ports:
      - 8080:8080
      - 443:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - asset-network

  # PostgreSQL Database (Optional - for production)
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: ams-postgres
    secrets:
      - postgres_user
      - postgres_password
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - ${POSTGRES_DB_LOCATION}:/var/lib/postgresql/data
    ports:
      - 5432:5432
    restart: unless-stopped
    networks:
      - asset-network

  # Redis Cache (Optional - for session storage)
  redis:
    image: redis:7-alpine
    secrets:
      - redis_password
    container_name: ams-redis
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - asset-network

networks:
  asset-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
